<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spavy VOC Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--p:#7c3aed;--p2:#6d28d9;--bg:#f8fafc;--card:#fff;--brd:#e2e8f0;--txt:#334155;--sub:#94a3b8;--r:10px}
*{margin:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);padding:16px 20px;color:var(--txt);font-size:13px}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#2563eb);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
h1{font-size:20px;font-weight:700;flex:1}
.hdr-btns{display:flex;gap:6px}
.hdr-btns button{padding:6px 12px;border-radius:7px;border:1px solid var(--brd);font-size:11px;cursor:pointer;background:var(--card);font-weight:500;transition:.15s}
.hdr-btns button:hover{border-color:#a5b4fc;background:#f5f3ff}
.btn-pub{background:var(--p)!important;color:#fff!important;border-color:var(--p)!important}
.btn-pub:hover{background:var(--p2)!important}
.btn-add{background:#059669!important;color:#fff!important;border-color:#059669!important}

.stats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:80px;padding:10px;border-radius:var(--r);background:var(--card);border:1px solid var(--brd);text-align:center;cursor:pointer;transition:.15s}
.stat:hover{border-color:var(--p);transform:translateY(-1px)}
.stat.active{border-color:var(--p);box-shadow:0 0 0 2px #7c3aed22}
.stat-n{font-size:22px;font-weight:700}
.stat-l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}

.main-tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:2px solid var(--brd);padding-bottom:0}
.main-tab{padding:8px 16px;font-size:12px;cursor:pointer;background:transparent;border:none;color:#64748b;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s}
.main-tab.active{color:var(--p);border-bottom-color:var(--p);font-weight:700}

.view-tabs{display:flex;gap:4px;margin-bottom:12px}
.vtab{padding:5px 12px;border-radius:6px;border:1px solid var(--brd);font-size:11px;cursor:pointer;background:transparent;color:#64748b;font-weight:400;transition:.15s}
.vtab.active{background:var(--p);color:#fff;border-color:var(--p);font-weight:600}

.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;background:var(--card);border-radius:var(--r);border:1px solid var(--brd);align-items:center}
.flt select,.flt input[type=text]{padding:5px 8px;border-radius:6px;border:1px solid #d1d5db;font-size:12px;background:#fff;min-width:90px}
.flt input[type=text]{min-width:180px}

table{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--brd)}
th{padding:8px 6px;text-align:left;background:#f8fafc;font-weight:600;color:#64748b;font-size:11px;border-bottom:2px solid var(--brd);position:sticky;top:0;z-index:2}
td{padding:7px 6px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover{background:#faf5ff}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap}
.s-신규{background:#ede9fe;color:#7c3aed}
.s-진행중{background:#fef3c7;color:#d97706}
.s-완료{background:#d1fae5;color:#059669}
.s-대기{background:#f1f5f9;color:#64748b}
.s-보류{background:#fee2e2;color:#dc2626}
.t-신규{background:#ede9fe;color:#7c3aed}
.t-개선{background:#dbeafe;color:#2563eb}
.t-버그{background:#fee2e2;color:#dc2626}
.t-보안{background:#fef3c7;color:#d97706}
.t-인프라{background:#ccfbf1;color:#0891b2}

.l1-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.grp-hdr{font-size:14px;font-weight:700;padding:12px 0 6px;border-bottom:2px solid var(--brd);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.grp-cnt{font-size:11px;color:var(--sub);font-weight:400}

/* Gantt */
.gantt-wrap{overflow-x:auto;background:var(--card);border-radius:var(--r);border:1px solid var(--brd);padding:12px}
.gantt-tbl{min-width:800px;border-collapse:collapse;font-size:11px;width:100%}
.gantt-tbl th{padding:6px 4px;font-size:10px;text-align:center;border-bottom:1px solid var(--brd);background:#f8fafc}
.gantt-tbl td{padding:4px;border-bottom:1px solid #f8fafc}
.gantt-bar{height:18px;border-radius:3px;min-width:4px}
.gantt-now{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;z-index:1}

/* Decision tab */
.urg-row{background:#fef2f2!important}
.urg-badge{background:#dc2626;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-right:4px}

/* Modal */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:14px;padding:20px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-size:16px;margin-bottom:14px}
.modal label{display:block;font-size:11px;font-weight:600;color:#64748b;margin:8px 0 3px}
.modal input,.modal select,.modal textarea{width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:12px;font-family:inherit}
.modal textarea{height:60px;resize:vertical}
.modal-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.modal-btns button{padding:8px 18px;border-radius:7px;font-size:12px;cursor:pointer;font-weight:600;border:1px solid var(--brd)}
.modal-btns .save{background:var(--p);color:#fff;border-color:var(--p)}
.modal-btns .del{background:#fee2e2;color:#dc2626;border-color:#fca5a5}

/* Mail tab */
.mail-area{width:100%;height:200px;border:2px dashed #d1d5db;border-radius:var(--r);padding:12px;font-size:12px;font-family:inherit;resize:vertical}
.mail-btn{padding:8px 20px;border-radius:7px;background:var(--p);color:#fff;border:none;font-size:12px;cursor:pointer;font-weight:600;margin-top:8px}
.mail-btn:disabled{opacity:.5}
.ext-card{border:1px solid var(--brd);border-radius:8px;padding:10px;margin:6px 0;cursor:pointer;transition:.15s}
.ext-card.sel{border-color:var(--p);background:#faf5ff}
.ext-card:hover{border-color:#a5b4fc}

/* Excel upload */
.drop-zone{border:2px dashed #d1d5db;border-radius:var(--r);padding:40px;text-align:center;color:var(--sub);cursor:pointer;transition:.15s;margin-bottom:12px}
.drop-zone:hover,.drop-zone.drag{border-color:var(--p);background:#faf5ff;color:var(--p)}

.toast{position:fixed;top:20px;right:20px;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:600;z-index:200;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.toast-ok{background:#d1fae5;color:#059669;border:1px solid #6ee7b7}
.toast-err{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}

.empty{text-align:center;padding:40px;color:var(--sub);font-size:13px}
.info-bar{padding:8px 14px;border-radius:8px;margin-bottom:12px;font-size:11px;display:flex;align-items:center;gap:6px}
.info-warn{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.info-ok{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
</style>
</head>
<body>

<div id="app"></div>

<script>
// ─── CONFIG ───
var L1_COLORS = {"Data Sync":"#534AB7","Spatial Studio":"#1D9E75","Data Studio":"#378ADD","Browser":"#D85A30","Ontology Sandbox":"#D4537E","BI":"#BA7517","Vizio":"#639922","360":"#85B7EB","Gaussian":"#888780","API":"#E05D44","Infra":"#4A6FA5","Designer":"#C75DAB"};
var L1_LIST = Object.keys(L1_COLORS);
var L2_MAP = {
  "Data Sync":[""],
  "Spatial Studio":["Spatial Planning","Spatial Data Positioning","Point Cloud Segmentation","Clash","Space"],
  "Data Studio":["QuerySet","Tabular","Composite","Custom Tree"],
  "Browser":["System Tree","Spatial Tree","Custom Tree","Spatial Data Tree","Export CD","Quick Space","Camera View","Saved Tab","Search Set","Camera Track","Text 3D","Scene","Dynamic Properties","Pin","Issue List","File List","Package List","Properties","Property Map","Dimension Editor","Viewer","Contents Viewer","Search Anything"],
  "Ontology Sandbox":[""],
  "BI":[""],
  "Vizio":[""],
  "360":[""],
  "Gaussian":[""],
  "API":[""],
  "Infra":["서버","DB","네트워크","배포","보안","모니터링"],
  "Designer":[""]
};
var TYPES = ["신규","개선","버그","보안","인프라"];
var STATUSES = ["신규","진행중","완료","대기","보류"];
var QS = ["Q1 2026","Q2 2026","Q3 2026","Q4 2026","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
var CUSTOMERS = ["E&A","삼성물산","삼성전자","기타"];
var TYPE_C = {"신규":"#7c3aed","개선":"#2563eb","버그":"#dc2626","보안":"#d97706","인프라":"#0891b2"};
var STATUS_C = {"신규":"#7c3aed","진행중":"#d97706","완료":"#059669","대기":"#64748b","보류":"#dc2626"};

// ─── INITIAL DATA ───
var INIT_DATA = [
  {id:"VOC-0001",customer:"E&A",l1:"Browser",l2:"Properties",type:"개선",title:"Property+ hovering",desc:"보고서 연동 시 hovering 기능",status:"진행중",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0002",customer:"E&A",l1:"Browser",l2:"Tree",type:"개선",title:"Project List 순서 변경",desc:"Project Group, Name 순서 변경 가능하도록",status:"완료",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0003",customer:"E&A",l1:"Browser",l2:"Viewer",type:"개선",title:"모듈창 새창/기존Tab 유지",desc:"동일 Project에서 모듈창 오픈 시 새창과 기존 Tab유지 모두 가능",status:"완료",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0004",customer:"E&A",l1:"Browser",l2:"Viewer",type:"버그",title:"Reset visibility 오류",desc:"R키 시 다른 폴더 파일 모두 로드되는 문제",status:"진행중",due:"Q1 2026",assignee:"",note:"",urgent:true},
  {id:"VOC-0005",customer:"E&A",l1:"Browser",l2:"Properties",type:"개선",title:"권한관리 상위/하위 자동선택",desc:"상위권한 선택 시 하위 자동선택 및 비활성화",status:"진행중",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0006",customer:"E&A",l1:"Browser",l2:"Search Anything",type:"신규",title:"Search 다중조건",desc:"Search set 외 다중조건 검색",status:"진행중",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0007",customer:"E&A",l1:"Data Studio",l2:"Tabular",type:"개선",title:"Tabular Data Manager 개선",desc:"Column setting 복사, std list, excel 업로드",status:"진행중",due:"Q1 2026",assignee:"",note:"삼인 Q1 가능",urgent:false},
  {id:"VOC-0008",customer:"E&A",l1:"BI",l2:"",type:"신규",title:"Fit World 기능",desc:"view 내에 fit world 추가",status:"진행중",due:"Q1 2026",assignee:"나경",note:"",urgent:false},
  {id:"VOC-0009",customer:"E&A",l1:"Spatial Studio",l2:"Space",type:"개선",title:"Space RVT Mass 인식",desc:"Revit Room 인식, Space 속성 연동",status:"진행중",due:"Q1 2026",assignee:"유현재",note:"",urgent:false},
  {id:"VOC-0010",customer:"E&A",l1:"Spatial Studio",l2:"Clash",type:"개선",title:"Clash File Download",desc:"Clash 파일 다운로드 기능",status:"완료",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0011",customer:"E&A",l1:"Browser",l2:"Viewer",type:"인프라",title:"Operation Spec 측정",desc:"최소/권장 인프라 사양 측정 및 제안",status:"대기",due:"Q2 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0012",customer:"E&A",l1:"Data Sync",l2:"",type:"개선",title:"SPAVY Manual URL 공유",desc:"사용자가 상시 MANUAL LINK에 접근",status:"대기",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0013",customer:"삼성물산",l1:"Browser",l2:"Viewer",type:"보안",title:"DB 암호화",desc:"Database 암호화 적용",status:"대기",due:"Q2 2026",assignee:"",note:"",urgent:true},
  {id:"VOC-0014",customer:"삼성전자",l1:"Browser",l2:"Export CD",type:"신규",title:"DWG 내보내기",desc:"DWG 파일 내보내기 기능",status:"대기",due:"Q2 2026",assignee:"",note:"E&A와 공통",urgent:false},
  {id:"VOC-0015",customer:"삼성전자",l1:"Browser",l2:"Properties",type:"개선",title:"권한 제어 RBAC",desc:"Role-Based Access Control 적용",status:"대기",due:"Q2 2026",assignee:"",note:"E&A SEA-5 연관",urgent:false}
];

// ─── STATE ───
var data = JSON.parse(JSON.stringify(INIT_DATA));
var mainTab = "dashboard"; // dashboard | excel | mail
var viewTab = "all"; // all | timeline | assignee | decision
var filterStatus = "";
var filterCust = "";
var filterL1 = "";
var filterType = "";
var searchQ = "";
var editItem = null;
var expandedId = null;
var showAddModal = false;
var dirty = false;
var toastMsg = "";
var toastType = "";
var toastTimer = null;
var mailText = "";
var mailResults = [];
var mailSelected = new Set();
var mailLoading = false;

var selectedIds = new Set();

// ─── HELPERS ───
function esc(s){return s?String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"):""}
function nextId(){
  var max=0;
  data.forEach(function(d){var n=parseInt(d.id.replace("VOC-",""),10);if(n>max)max=n;});
  return "VOC-"+String(max+1).padStart(4,"0");
}
function toast(msg,type){
  toastMsg=msg;toastType=type||"ok";render();
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastMsg="";render();},3000);
}
function getFiltered(){
  return data.filter(function(d){
    if(filterStatus&&d.status!==filterStatus)return false;
    if(filterCust&&d.customer!==filterCust)return false;
    if(filterL1&&d.l1!==filterL1)return false;
    if(filterType&&d.type!==filterType)return false;
    if(searchQ){var q=searchQ.toLowerCase();if((d.title+d.desc+d.customer+d.id+d.assignee+d.note).toLowerCase().indexOf(q)<0)return false;}
    return true;
  });
}
function getCustomers(){var s=new Set();data.forEach(function(d){if(d.customer)s.add(d.customer);});return Array.from(s).sort();}
function groupBy(arr,key){var m={};arr.forEach(function(d){var k=d[key]||"미배정";if(!m[k])m[k]=[];m[k].push(d);});return m;}

// ─── RENDER ───
function render(){
  var app=document.getElementById("app");
  var items=getFiltered();
  var custs=getCustomers();
  var counts={total:data.length,신규:0,진행중:0,완료:0,대기:0};
  data.forEach(function(d){if(counts[d.status]!==undefined)counts[d.status]++;});

  var h="";

  // Toast
  if(toastMsg)h+='<div class="toast toast-'+toastType+'">'+esc(toastMsg)+'</div>';

  // Header
  h+='<div class="hdr">';
  h+='<div class="logo">S</div>';
  h+='<div><h1>Spavy VOC Dashboard</h1><div class="sub">Voice of Customer · 통합 관리</div></div>';
  h+='<div class="hdr-btns">';
  h+='<button class="btn-add" onclick="openAdd()">＋ 추가</button>';
  h+='<button class="btn-pub" onclick="doPublish()">🚀 발행</button>';
  h+='<button onclick="dlExcel()">📥 Excel</button>';
  h+='<button onclick="dlPdf()">📄 PDF</button>';
  h+='</div></div>';

  // Dirty bar
  if(dirty)h+='<div class="info-bar info-warn">⚠️ 수정사항이 있습니다. [발행] 버튼을 눌러 data.json을 다운로드하고 git push 하세요.</div>';

  // Stats
  h+='<div class="stats">';
  var statKeys=[["total","전체","#334155"],["신규","신규","#7c3aed"],["진행중","진행중","#d97706"],["완료","완료","#059669"],["대기","대기","#64748b"]];
  statKeys.forEach(function(sk){
    var active=(sk[0]==="total"&&!filterStatus)||(sk[0]!=="total"&&filterStatus===sk[0]);
    h+='<div class="stat'+(active?" active":"")+'" onclick="clickStat(\''+sk[0]+'\')">';
    h+='<div class="stat-n" style="color:'+sk[2]+'">'+counts[sk[0]]+'</div>';
    h+='<div class="stat-l">'+sk[1]+'</div></div>';
  });
  h+='</div>';

  // Main tabs
  h+='<div class="main-tabs">';
  [["dashboard","📊 대시보드"],["excel","📁 Excel 가져오기"],["mail","✉️ 메일에서 추출"]].forEach(function(t){
    h+='<button class="main-tab'+(mainTab===t[0]?" active":"")+'" onclick="setMainTab(\''+t[0]+'\')">'+t[1]+'</button>';
  });
  h+='</div>';

  if(mainTab==="dashboard"){
    // View tabs
    h+='<div class="view-tabs">';
    [["all","전체 목록"],["timeline","타임라인"],["assignee","담당자별"],["decision","결정필요"]].forEach(function(v){
      h+='<button class="vtab'+(viewTab===v[0]?" active":"")+'" onclick="setView(\''+v[0]+'\')">'+v[1]+'</button>';
    });
    h+='</div>';

    // Filters
    h+='<div class="flt">';
    h+='<input type="text" placeholder="🔍 검색..." value="'+esc(searchQ)+'" oninput="searchQ=this.value;render()">';
    h+='<select onchange="filterCust=this.value;render()"><option value="">고객사 전체</option>';
    CUSTOMERS.forEach(function(c){h+='<option'+(filterCust===c?' selected':'')+'>'+esc(c)+'</option>';});
    h+='</select>';
    h+='<select onchange="filterL1=this.value;render()"><option value="">L1 전체</option>';
    L1_LIST.forEach(function(l){h+='<option'+(filterL1===l?' selected':'')+'>'+esc(l)+'</option>';});
    h+='</select>';
    h+='<select onchange="filterType=this.value;render()"><option value="">유형 전체</option>';
    TYPES.forEach(function(t){h+='<option'+(filterType===t?' selected':'')+'>'+esc(t)+'</option>';});
    h+='</select>';
    if(filterStatus||filterCust||filterL1||filterType||searchQ)h+='<button onclick="clearFilters()" style="padding:4px 10px;border-radius:5px;border:1px solid #fca5a5;background:#fee2e2;color:#dc2626;font-size:11px;cursor:pointer">✕ 초기화</button>';
    h+='</div>';

    // Views
    if(viewTab==="all") h+=renderTable(items,false);
    else if(viewTab==="timeline") h+=renderTimeline(items);
    else if(viewTab==="assignee") h+=renderAssignee(items);
    else if(viewTab==="decision") h+=renderDecision();
  } else if(mainTab==="excel"){
    h+=renderExcelTab();
  } else if(mainTab==="mail"){
    h+=renderMailTab();
  }

  // Add modal only
  if(showAddModal) h+=renderAddModal();

  app.innerHTML=h;
}

// ─── TABLE ───
function renderTable(items,showUrgent){
  if(!items.length) return '<div class="empty">조건에 맞는 항목이 없습니다.</div>';
  var h='';

// ─── TIMELINE (Gantt) ───
function renderTimeline(items){
  var months=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
  var now=new Date();var curM=now.getMonth();var curY=now.getFullYear();
  var qMap={"Q1 2026":[2026,0,2],"Q2 2026":[2026,3,5],"Q3 2026":[2026,6,8],"Q4 2026":[2026,9,11],"4월":[2026,3,3],"5월":[2026,4,4],"6월":[2026,5,5],"7월":[2026,6,6],"8월":[2026,7,7],"9월":[2026,8,8],"10월":[2026,9,9],"11월":[2026,10,10],"12월":[2026,11,11]};
  var dispMonths=[];
  for(var m=0;m<=11;m++){dispMonths.push({y:2026,m:m,label:(m+1)+"월"});}

  var ganttItems=items.filter(function(d){return d.due&&qMap[d.due];}).sort(function(a,b){
    var am=qMap[a.due],bm=qMap[b.due];return (am[0]*12+am[1])-(bm[0]*12+bm[1]);
  });

  var h='<div class="gantt-wrap"><table class="gantt-tbl"><thead><tr>';
  h+='<th style="min-width:60px;text-align:left">ID</th><th style="min-width:100px;text-align:left">제목</th><th style="min-width:40px">상태</th>';
  dispMonths.forEach(function(dm){
    var isCur=dm.y===curY&&dm.m===curM;
    h+='<th style="min-width:28px;font-size:9px;'+(isCur?'background:#fef2f2;color:#dc2626;font-weight:700':'')+'">'+dm.label+'</th>';
  });
  h+='</tr></thead><tbody>';

  ganttItems.forEach(function(d){
    var q=qMap[d.due];if(!q)return;
    var sc={"완료":"#22c55e","진행중":"#f59e0b","신규":"#8b5cf6","대기":"#94a3b8","보류":"#ef4444"};
    h+='<tr ondblclick="openEdit(\''+d.id+'\')" style="cursor:pointer">';
    h+='<td style="font-family:monospace;font-size:10px;color:var(--sub)">'+esc(d.id)+'</td>';
    h+='<td style="font-size:11px;font-weight:500;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(d.desc)+'">'+esc(d.title)+'</td>';
    h+='<td style="text-align:center"><span class="badge s-'+d.status+'" style="font-size:9px">'+esc(d.status)+'</span></td>';
    dispMonths.forEach(function(dm){
      var inRange=dm.y===q[0]&&dm.m>=q[1]&&dm.m<=q[2];
      var isCur=dm.y===curY&&dm.m===curM;
      if(inRange){
        h+='<td style="padding:2px"><div class="gantt-bar" style="background:'+(sc[d.status]||"#94a3b8")+'"></div></td>';
      } else {
        h+='<td style="'+(isCur?'background:#fef2f2':'')+'"></td>';
      }
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  if(!ganttItems.length)h='<div class="empty">타임라인에 표시할 항목이 없습니다.</div>';
  return h;
}

// ─── ASSIGNEE ───
function renderAssignee(items){
  var g=groupBy(items,"assignee");
  var keys=Object.keys(g).sort(function(a,b){return a==="미배정"?-1:b==="미배정"?1:a.localeCompare(b);});
  var h="";
  keys.forEach(function(k){
    var isNone=k==="미배정";
    h+='<div class="grp-hdr" style="'+(isNone?"color:#dc2626":"")+'">👤 '+esc(k)+' <span class="grp-cnt">'+g[k].length+'건</span></div>';
    h+=renderTable(g[k],false);
  });
  return h||'<div class="empty">표시할 항목이 없습니다.</div>';
}

function clickStat(key){

  else{filterStatus=filterStatus===key?"":key;}
  render();
}
function setMainTab(t){mainTab=t;render();}
function setView(v){viewTab=v;render();}
function clearFilters(){filterStatus="";filterCust="";filterL1="";filterType="";searchQ="";render();}

function openEdit(id){expandedId=expandedId===id?null:id;render();}
function toggleExpand(id){expandedId=expandedId===id?null:id;render();}
function openAdd(){showAddModal=true;expandedId=null;render();}
function closeModal(e){if(e.target.classList.contains("modal-bg")){expandedId=null;showAddModal=false;render();}}

function onExpandL1Change(){

  data[idx].customer=document.getElementById("x-cust").value;

  data[idx].l1=document.getElementById("x-l1").value;
  data[idx].l2=document.getElementById("x-l2").value;
  data[idx].type=document.getElementById("x-type").value;
  data[idx].status=document.getElementById("x-status").value;
  data[idx].due=document.getElementById("x-due").value;
  data[idx].assignee=document.getElementById("x-assignee").value.trim();
  data[idx].note=document.getElementById("x-note").value.trim();
  data[idx].urgent=document.getElementById("x-urgent").checked;

function saveAdd(){
  var item={
    id:nextId(),
    customer:document.getElementById("a-cust").value,
    l1:document.getElementById("a-l1").value,
    l2:document.getElementById("a-l2").value,
    type:document.getElementById("a-type").value,
    title:document.getElementById("a-title").value.trim()||"제목 없음",
    desc:document.getElementById("a-desc").value.trim(),
    status:document.getElementById("a-status").value,
    due:document.getElementById("a-due").value,
    assignee:document.getElementById("a-assignee").value.trim(),
    note:document.getElementById("a-note").value.trim(),
    urgent:false
  };
  data.push(item);showAddModal=false;dirty=true;
  toast("✅ "+item.id+" 추가됨","ok");
  render();
}

function delItem(id){
  if(!confirm(id+" 항목을 삭제하시겠습니까?"))return;
  data=data.filter(function(d){return d.id!==id;});
  editItem=null;dirty=true;
  toast("🗑️ "+id+" 삭제됨","ok");
  render();
}

function toggleUrgent(id){
  var item=data.find(function(d){return d.id===id;});
  if(item){item.urgent=!item.urgent;dirty=true;render();}
}

function toggleSel(id,checked){
  if(checked)selectedIds.add(id);else selectedIds.delete(id);
  render();
}
function toggleAll(checked,ids){
  ids.split(",").forEach(function(id){if(checked)selectedIds.add(id);else selectedIds.delete(id);});
  render();
}
function delSelected(){
  if(!confirm(selectedIds.size+"건을 삭제하시겠습니까?"))return;
  data=data.filter(function(d){return !selectedIds.has(d.id);});
  var cnt=selectedIds.size;selectedIds.clear();dirty=true;
  toast("🗑️ "+cnt+"건 삭제됨","ok");
  render();
}

// ─── PUBLISH ───
function doPublish(){
  var json=JSON.stringify(data,null,2);
  var blob=new Blob([json],{type:"application/json"});

  document.body.appendChild(a);a.click();document.body.removeChild(a);

// ─── EXCEL UPLOAD ───
function handleDrop(e){
  e.preventDefault();e.target.classList.remove("drag");
  var file=e.dataTransfer.files[0];
  if(file)parseXl(file);
}
function handleXlFile(input){
  if(input.files[0])parseXl(input.files[0]);
}
function parseXl(file){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:"array"});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1});
      if(rows.length<2){toast("❌ 데이터가 없습니다","err");return;}
      var added=0;
      for(var i=1;i<rows.length;i++){
        var r=rows[i];if(!r||!r[5])continue;
        data.push({
          id:r[0]||nextId(),
          customer:String(r[1]||"미정").trim(),
          l1:String(r[2]||"Browser").trim(),
          l2:String(r[3]||"").trim(),
          type:String(r[4]||"신규").trim(),
          title:String(r[5]||"").trim(),
          desc:String(r[6]||"").trim(),
          status:String(r[7]||"신규").trim(),
          due:String(r[8]||"").trim(),
          assignee:String(r[9]||"").trim(),
          note:String(r[10]||"").trim(),
          urgent:String(r[11]||"").toUpperCase()==="Y"
        });
        added++;
      }
      dirty=true;mainTab="dashboard";
      toast("✅ "+added+"건 추가됨","ok");
      render();
    }catch(err){toast("❌ 파일 파싱 오류: "+err.message,"err");}
  };
  reader.readAsArrayBuffer(file);
}

// ─── MAIL AI (로컬 파싱) ───
function runMailAI(){
  var txt=document.getElementById("mailInput").value.trim();
  if(!txt){toast("❌ 메일 내용을 붙여넣어 주세요","err");return;}
  mailText=txt;mailResults=[];mailSelected=new Set();

  // 고객사 감지
  var detCust="기타";
  if(/e&a|이앤에이|E&A|ea /i.test(txt))detCust="E&A";
  else if(/삼성물산|물산/i.test(txt))detCust="삼성물산";
  else if(/삼성전자|전자/i.test(txt))detCust="삼성전자";

  // L1 감지 맵
  var l1Keys=[
    {re:/data\s*sync|동기화|sync/i,l1:"Data Sync"},
    {re:/spatial\s*studio|planning|positioning|pcs|clash|space/i,l1:"Spatial Studio"},
    {re:/data\s*studio|queryset|tabular|composite/i,l1:"Data Studio"},
    {re:/ontology|sandbox/i,l1:"Ontology Sandbox"},
    {re:/\bBI\b|PBI|리포트|report|대시보드/i,l1:"BI"},
    {re:/vizio|비지오/i,l1:"Vizio"},
    {re:/\b360\b/i,l1:"360"},
    {re:/gaussian|가우시안/i,l1:"Gaussian"},
    {re:/\bAPI\b|api\b/i,l1:"API"}
  ];

  // 유형 감지
  function detType(s){
    if(/버그|bug|오류|에러|error|문제|안됨|안 됨|작동.*않|crash/i.test(s))return "버그";
    if(/보안|security|암호화|인증|권한/i.test(s))return "보안";
    if(/인프라|infra|서버|성능|속도|배포/i.test(s))return "인프라";
    if(/신규|new|추가|생성|만들어|새로운|새 기능/i.test(s))return "신규";
    return "개선";
  }

  // 줄 단위 파싱 — 각 줄/문장을 VOC 후보로
  var lines=txt.split(/[\n\r]+/).map(function(l){return l.trim();}).filter(function(l){
    return l.length>5 && !/^(from|to|cc|bcc|subject|date|sent|받는|보내는|보낸|참조|날짜|제목)[\s:：]/i.test(l)
      && !/^[-=_]{3,}/.test(l) && !/^(안녕|감사|수고|확인|부탁|드립니다|합니다)/.test(l)
      && !/^(hi|hello|dear|thanks|regards|best|sincerely)/i.test(l);
  });

  // 번호 매기기 패턴 감지 (1. 또는 - 또는 · 등)
  var numbered=lines.filter(function(l){return /^[\d]+[\.\)]\s|^[-·•]\s|^[①②③④⑤⑥⑦⑧⑨⑩]/.test(l);});
  var candidates=numbered.length>=2?numbered:lines;

  // 중복 제거 및 의미 있는 항목만
  var seen=new Set();
  candidates.forEach(function(line){
    var clean=line.replace(/^[\d]+[\.\)]\s*|^[-·•]\s*|^[①②③④⑤⑥⑦⑧⑨⑩]\s*/,"").trim();
    if(clean.length<4||seen.has(clean.substring(0,20)))return;
    seen.add(clean.substring(0,20));

    // L1 감지
    var detL1="Browser";
    for(var i=0;i<l1Keys.length;i++){if(l1Keys[i].re.test(clean)){detL1=l1Keys[i].l1;break;}}

    var title=clean.length>40?clean.substring(0,40)+"...":clean;
    var desc=clean.length>40?clean:""  ;

    mailResults.push({
      customer:detCust,
      l1:detL1,
      l2:"",
      type:detType(clean),
      title:title,
      desc:desc,
      status:"신규",
      due:""
    });
  });

  if(mailResults.length===0){
    // 전체 텍스트를 하나의 VOC로
    var allText=lines.join(" ").substring(0,200);
    if(allText.length>4){
      mailResults.push({
        customer:detCust,l1:"Browser",l2:"",type:detType(allText),
        title:allText.substring(0,40),desc:allText,status:"신규",due:""
      });
    }
  }

  mailResults.forEach(function(_,i){mailSelected.add(i);});
  toast("✅ "+mailResults.length+"건 추출됨 — 확인 후 선택하세요","ok");
  render();
}

function toggleMailSel(i){
  if(mailSelected.has(i))mailSelected.delete(i);else mailSelected.add(i);
  render();
}

function importMailResults(){
  var added=0;
  mailResults.forEach(function(v,i){
    if(!mailSelected.has(i))return;
    data.push({
      id:nextId(),
      customer:v.customer||"미정",
      l1:v.l1||"Browser",
      l2:v.l2||"",
      type:v.type||"신규",
      title:v.title||"제목 없음",
      desc:v.desc||"",
      status:v.status||"신규",
      due:v.due||"",
      assignee:v.assignee||"",
      note:v.note||"메일에서 추출",
      urgent:false
    });
    added++;
  });
  mailResults=[];mailSelected=new Set();mainTab="dashboard";dirty=true;
  toast("✅ "+added+"건 대시보드에 추가됨","ok");
  render();
}

// ─── LOAD data.json ───
function loadData(){
  fetch("data.json").then(function(r){
    if(!r.ok)throw new Error("no file");
    return r.json();
  }).then(function(d){
    if(Array.isArray(d)&&d.length>0){
      data=d.map(function(item){item.urgent=item.urgent||false;return item;});
      render();
    }
  }).catch(function(){render();});
}

// ─── INIT ───
loadData();
