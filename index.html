<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spavy VOC Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--p:#7c3aed;--p2:#6d28d9;--bg:#f8fafc;--card:#fff;--brd:#e2e8f0;--txt:#334155;--sub:#94a3b8;--r:10px}
*{margin:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);padding:16px 20px;color:var(--txt);font-size:13px}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#2563eb);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
h1{font-size:20px;font-weight:700;flex:1}
.hdr-btns{display:flex;gap:6px;flex-wrap:wrap}
.hdr-btns button{padding:6px 12px;border-radius:7px;border:1px solid var(--brd);font-size:11px;cursor:pointer;background:var(--card);font-weight:500}
.btn-pub{background:var(--p)!important;color:#fff!important;border-color:var(--p)!important}
.btn-add{background:#059669!important;color:#fff!important;border-color:#059669!important}
.stats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:80px;padding:10px;border-radius:var(--r);background:var(--card);border:1px solid var(--brd);text-align:center;cursor:pointer}
.stat.active{border-color:var(--p);box-shadow:0 0 0 2px #7c3aed22}
.stat-n{font-size:22px;font-weight:700}.stat-l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.main-tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:2px solid var(--brd)}
.main-tab{padding:8px 16px;font-size:12px;cursor:pointer;background:transparent;border:none;color:#64748b;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-2px}
.main-tab.active{color:var(--p);border-bottom-color:var(--p);font-weight:700}
.view-tabs{display:flex;gap:4px;margin-bottom:12px}
.vtab{padding:5px 12px;border-radius:6px;border:1px solid var(--brd);font-size:11px;cursor:pointer;background:transparent;color:#64748b}
.vtab.active{background:var(--p);color:#fff;border-color:var(--p);font-weight:600}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;background:var(--card);border-radius:var(--r);border:1px solid var(--brd);align-items:center}
.flt select,.flt input[type=text]{padding:5px 8px;border-radius:6px;border:1px solid #d1d5db;font-size:12px;background:#fff;min-width:90px}
.flt input[type=text]{min-width:180px}
table{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--brd)}
th{padding:8px 6px;text-align:left;background:#f8fafc;font-weight:600;color:#64748b;font-size:11px;border-bottom:2px solid var(--brd)}
td{padding:7px 6px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.row-click:hover{background:#faf5ff}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap}
.s-신규{background:#ede9fe;color:#7c3aed}.s-진행중{background:#fef3c7;color:#d97706}.s-완료{background:#d1fae5;color:#059669}.s-대기{background:#f1f5f9;color:#64748b}.s-보류{background:#fee2e2;color:#dc2626}
.t-신규{background:#ede9fe;color:#7c3aed}.t-개선{background:#dbeafe;color:#2563eb}.t-버그{background:#fee2e2;color:#dc2626}.t-보안{background:#fef3c7;color:#d97706}.t-인프라{background:#ccfbf1;color:#0891b2}
.l1dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.expand-panel{padding:16px;background:#faf5ff;border-top:1px solid #e9e5f5}
.ep-section{background:#fff;border:1px solid var(--brd);border-radius:8px;padding:12px;margin-bottom:10px}
.ep-label{font-size:10px;font-weight:600;color:#64748b;margin-bottom:3px;display:block}
.ep-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ep-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ep-grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.ep-input{width:100%;padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;font-family:inherit}
.ep-ta{width:100%;padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;height:50px;resize:vertical;font-family:inherit}
.ep-btns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.ep-btns button{padding:6px 14px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600;border:1px solid var(--brd)}
.grp-hdr{font-size:14px;font-weight:700;padding:12px 0 6px;border-bottom:2px solid var(--brd);margin-bottom:8px}
.grp-cnt{font-size:11px;color:var(--sub);font-weight:400}
.gantt-wrap{overflow-x:auto;background:var(--card);border-radius:var(--r);border:1px solid var(--brd);padding:12px}
.gantt-tbl{min-width:700px;border-collapse:collapse;font-size:11px;width:100%}
.gantt-tbl th{padding:6px 4px;font-size:10px;text-align:center;border-bottom:1px solid var(--brd);background:#f8fafc}
.gantt-tbl td{padding:4px;border-bottom:1px solid #f8fafc}
.gantt-bar{height:18px;border-radius:3px;min-width:4px}
.urg-row{background:#fef2f2!important}
.urg-badge{background:#dc2626;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-right:4px}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:14px;padding:20px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-size:16px;margin-bottom:14px}
.modal label{display:block;font-size:11px;font-weight:600;color:#64748b;margin:8px 0 3px}
.modal input,.modal select,.modal textarea{width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:12px;font-family:inherit}
.modal textarea{height:60px;resize:vertical}
.modal-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.modal-btns button{padding:8px 18px;border-radius:7px;font-size:12px;cursor:pointer;font-weight:600;border:1px solid var(--brd)}
.modal-btns .save{background:var(--p);color:#fff;border-color:var(--p)}
.modal-btns .del{background:#fee2e2;color:#dc2626;border-color:#fca5a5}
.mail-area{width:100%;height:200px;border:2px dashed #d1d5db;border-radius:var(--r);padding:12px;font-size:12px;font-family:inherit;resize:vertical}
.mail-btn{padding:8px 20px;border-radius:7px;background:var(--p);color:#fff;border:none;font-size:12px;cursor:pointer;font-weight:600;margin-top:8px}
.mail-btn:disabled{opacity:.5}
.ext-card{border:1px solid var(--brd);border-radius:8px;padding:10px;margin:6px 0;cursor:pointer}
.ext-card.sel{border-color:var(--p);background:#faf5ff}
.drop-zone{border:2px dashed #d1d5db;border-radius:var(--r);padding:40px;text-align:center;color:var(--sub);cursor:pointer;margin-bottom:12px}
.drop-zone:hover,.drop-zone.drag{border-color:var(--p);background:#faf5ff;color:var(--p)}
.toast{position:fixed;top:20px;right:20px;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:600;z-index:200;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateY(-10px)}to{opacity:1}}
.toast-ok{background:#d1fae5;color:#059669;border:1px solid #6ee7b7}
.toast-err{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}
.empty{text-align:center;padding:40px;color:var(--sub)}
.info-bar{padding:8px 14px;border-radius:8px;margin-bottom:12px;font-size:11px;display:flex;align-items:center;gap:6px}
.info-warn{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.sel-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:8px 12px;background:#fee2e2;border-radius:8px;border:1px solid #fca5a5}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── CONFIG ──
var L1C={"Data Sync":"#534AB7","Spatial Studio":"#1D9E75","Data Studio":"#378ADD","Browser":"#D85A30","Ontology Sandbox":"#D4537E","BI":"#BA7517","Vizio":"#639922","360":"#85B7EB","Gaussian":"#888780","API":"#E05D44","Infra":"#4A6FA5","Designer":"#C75DAB","Admin":"#8B5E3C","PJT":"#2D9CDB","User":"#6C5CE7","Auth":"#E17055","Portal":"#00B894"};
var L1S=Object.keys(L1C);
var L2M={
  "Data Sync":[],"Spatial Studio":["Spatial Planning","Spatial Data Positioning","Point Cloud Segmentation","Clash","Space"],
  "Data Studio":["QuerySet","Tabular","Composite","Custom Tree"],
  "Browser":["System Tree","Spatial Tree","Custom Tree","Spatial Data Tree","Export CD","Quick Space","Camera View","Saved Tab","Search Set","Camera Track","Text 3D","Scene","Dynamic Properties","Pin","Issue List","File List","Package List","Properties","Property Map","Dimension Editor","Viewer","Contents Viewer","Search Anything","Spavy Dock","FPL"],
  "Ontology Sandbox":[],"BI":[],"Vizio":[],"360":[],"Gaussian":[],"API":[],
  "Infra":["서버","DB","네트워크","배포","보안","모니터링"],"Designer":[],
  "Admin":["권한관리","시스템설정","라이선스","로그관리","백업"],
  "PJT":["프로젝트 생성","프로젝트 설정","템플릿","마이그레이션"],
  "User":["사용자관리","그룹관리","프로필","알림설정"],
  "Auth":["로그인","SSO","MFA","세션"],"Portal":["대시보드","공지","가이드","FAQ"]
};
var CUSTS=["E&A","삼성물산","삼성전자","기타"];
var TYPES=["신규","개선","버그","보안","인프라"];
var STATS=["신규","진행중","완료","대기","보류"];
var QS=["Q1 2026","Q2 2026","Q3 2026","Q4 2026","4월","5월","6월","7월","8월","9월","10월","11월","12월"];

// ── SAMPLE DATA ──
var INIT=[
  {id:"VOC-0001",customer:"E&A",l1:"Browser",l2:"Properties",type:"개선",title:"Property+ hovering",desc:"보고서 연동 시 hovering 기능",status:"진행중",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0002",customer:"E&A",l1:"Browser",l2:"System Tree",type:"개선",title:"Project List 순서 변경",desc:"Project Group, Name 순서 변경 가능하도록",status:"완료",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0003",customer:"E&A",l1:"Browser",l2:"Viewer",type:"개선",title:"모듈창 새창/기존Tab 유지",desc:"동일 Project에서 모듈창 오픈 시 새창과 기존 Tab유지 모두 가능",status:"완료",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0004",customer:"E&A",l1:"Browser",l2:"Viewer",type:"버그",title:"Reset visibility 오류",desc:"R키 시 다른 폴더 파일 모두 로드되는 문제",status:"진행중",due:"Q1 2026",assignee:"",note:"",urgent:true},
  {id:"VOC-0005",customer:"E&A",l1:"Browser",l2:"Properties",type:"개선",title:"권한관리 상위/하위 자동선택",desc:"상위권한 선택 시 하위 자동선택 및 비활성화",status:"진행중",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0006",customer:"E&A",l1:"Browser",l2:"Search Anything",type:"신규",title:"Search 다중조건",desc:"Search set 외 다중조건 검색",status:"진행중",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0007",customer:"E&A",l1:"Data Studio",l2:"Tabular",type:"개선",title:"Tabular Data Manager 개선",desc:"Column setting 복사, std list, excel 업로드",status:"진행중",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0008",customer:"E&A",l1:"BI",l2:"",type:"신규",title:"Fit World 기능",desc:"view 내에 fit world 추가",status:"진행중",due:"Q1 2026",assignee:"나경",note:"",urgent:false},
  {id:"VOC-0009",customer:"E&A",l1:"Spatial Studio",l2:"Space",type:"개선",title:"Space RVT Mass 인식",desc:"Revit Room 인식, Space 속성 연동",status:"진행중",due:"Q1 2026",assignee:"유현재",note:"",urgent:false},
  {id:"VOC-0010",customer:"E&A",l1:"Spatial Studio",l2:"Clash",type:"개선",title:"Clash File Download",desc:"Clash 파일 다운로드 기능",status:"완료",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0011",customer:"E&A",l1:"Infra",l2:"서버",type:"인프라",title:"Operation Spec 측정",desc:"최소/권장 인프라 사양 측정 및 제안",status:"대기",due:"Q2 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0012",customer:"E&A",l1:"Data Sync",l2:"",type:"개선",title:"SPAVY Manual URL 공유",desc:"사용자가 상시 MANUAL LINK에 접근",status:"대기",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0013",customer:"삼성물산",l1:"Infra",l2:"DB",type:"보안",title:"DB 암호화",desc:"Database 암호화 적용",status:"대기",due:"Q2 2026",assignee:"",note:"",urgent:true},
  {id:"VOC-0014",customer:"삼성전자",l1:"Browser",l2:"Export CD",type:"신규",title:"DWG 내보내기",desc:"DWG 파일 내보내기 기능",status:"대기",due:"Q2 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0015",customer:"삼성전자",l1:"Auth",l2:"",type:"개선",title:"권한 제어 RBAC",desc:"Role-Based Access Control 적용",status:"대기",due:"Q2 2026",assignee:"",note:"",urgent:false}
];

// ── STATE ──
var data=JSON.parse(JSON.stringify(INIT));
var mainTab="dashboard",viewTab="all";
var fS="",fC="",fL="",fT="",sQ="";
var expId=null,showAdd=false,dirty=false;
var selIds=new Set();
var toastM="",toastT="",toastTm=null;
var mailTxt="",mailRes=[],mailSel=new Set();

// ── UTIL ──
function E(s){return s?String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"):""}
function nId(){var m=0;data.forEach(function(d){var n=parseInt(d.id.replace("VOC-",""),10);if(n>m)m=n;});return "VOC-"+String(m+1).padStart(4,"0")}
function toast(m,t){toastM=m;toastT=t||"ok";R();if(toastTm)clearTimeout(toastTm);toastTm=setTimeout(function(){toastM="";R()},3000)}
function gF(){return data.filter(function(d){if(fS&&d.status!==fS)return false;if(fC&&d.customer!==fC)return false;if(fL&&d.l1!==fL)return false;if(fT&&d.type!==fT)return false;if(sQ){var q=sQ.toLowerCase();if((d.title+d.desc+d.customer+d.id+d.assignee+d.note).toLowerCase().indexOf(q)<0)return false;}return true})}

// ── MAIN RENDER ──
function R(){
  var el=document.getElementById("app"),items=gF();
  var cnt={total:data.length};STATS.forEach(function(s){cnt[s]=0});data.forEach(function(d){if(cnt[d.status]!==undefined)cnt[d.status]++});
  var h="";
  if(toastM)h+='<div class="toast toast-'+toastT+'">'+E(toastM)+'</div>';

  // Header
  h+='<div class="hdr"><div class="logo">S</div><div><h1>Spavy VOC Dashboard</h1><div style="font-size:12px;color:var(--sub)">Voice of Customer · 통합 관리</div></div>';
  h+='<div class="hdr-btns"><button class="btn-add" onclick="openAdd()">＋ 추가</button><button class="btn-pub" onclick="doPublish()">🚀 발행</button><button onclick="dlExcel()">📥 Excel</button><button onclick="dlPdf()">📄 PDF</button></div></div>';
  if(dirty)h+='<div class="info-bar info-warn">⚠️ 수정사항 있음 — [발행]으로 data.json 다운로드 후 git push 하세요</div>';

  // Stats
  h+='<div class="stats">';
  [["total","전체","#334155"],["신규","신규","#7c3aed"],["진행중","진행중","#d97706"],["완료","완료","#059669"],["대기","대기","#64748b"]].forEach(function(s){
    var ac=(s[0]==="total"&&!fS)||(s[0]!=="total"&&fS===s[0]);
    h+='<div class="stat'+(ac?" active":"")+'" onclick="fS=fS===\''+s[0]+'\'||(\''+s[0]+'\'===\'total\')?\'\':\'' +s[0]+'\';R()"><div class="stat-n" style="color:'+s[2]+'">'+cnt[s[0]]+'</div><div class="stat-l">'+s[1]+'</div></div>';
  });
  h+='</div>';

  // Main tabs
  h+='<div class="main-tabs">';
  [["dashboard","📊 대시보드"],["excel","📁 Excel 가져오기"],["mail","✉️ 메일에서 추출"]].forEach(function(t){
    h+='<button class="main-tab'+(mainTab===t[0]?" active":"")+'" onclick="mainTab=\''+t[0]+'\';R()">'+t[1]+'</button>';
  });
  h+='</div>';

  if(mainTab==="dashboard"){
    h+='<div class="view-tabs">';
    [["all","전체 목록"],["timeline","타임라인"],["assignee","담당자별"],["decision","결정필요"]].forEach(function(v){
      h+='<button class="vtab'+(viewTab===v[0]?" active":"")+'" onclick="viewTab=\''+v[0]+'\';R()">'+v[1]+'</button>';
    });
    h+='</div>';
    // Filters
    h+='<div class="flt"><input type="text" placeholder="🔍 검색..." value="'+E(sQ)+'" oninput="sQ=this.value;R()">';
    h+='<select onchange="fC=this.value;R()"><option value="">고객사 전체</option>';CUSTS.forEach(function(c){h+='<option'+(fC===c?' selected':'')+'>'+E(c)+'</option>'});h+='</select>';
    h+='<select onchange="fL=this.value;R()"><option value="">L1 전체</option>';L1S.forEach(function(l){h+='<option'+(fL===l?' selected':'')+'>'+E(l)+'</option>'});h+='</select>';
    h+='<select onchange="fT=this.value;R()"><option value="">유형 전체</option>';TYPES.forEach(function(t){h+='<option'+(fT===t?' selected':'')+'>'+E(t)+'</option>'});h+='</select>';
    if(fS||fC||fL||fT||sQ)h+='<button onclick="fS=fC=fL=fT=sQ=\'\';R()" style="padding:4px 10px;border-radius:5px;border:1px solid #fca5a5;background:#fee2e2;color:#dc2626;font-size:11px;cursor:pointer">✕ 초기화</button>';
    h+='</div>';
    if(viewTab==="all")h+=rTbl(items,false);
    else if(viewTab==="timeline")h+=rTimeline(items);
    else if(viewTab==="assignee")h+=rAssignee(items);
    else if(viewTab==="decision")h+=rDecision();
  }else if(mainTab==="excel")h+=rExcel();
  else if(mainTab==="mail")h+=rMail();
  if(showAdd)h+=rAddModal();
  el.innerHTML=h;
}

// ── TABLE ──
function rTbl(items,showUrg){
  if(!items.length)return '<div class="empty">조건에 맞는 항목이 없습니다.</div>';
  var h="";
  if(selIds.size>0)h+='<div class="sel-bar"><span style="font-size:12px;font-weight:600;color:#dc2626">'+selIds.size+'건 선택</span><button onclick="doDel()" style="padding:4px 12px;border-radius:6px;border:1px solid #dc2626;background:#dc2626;color:#fff;font-size:11px;cursor:pointer;font-weight:600">🗑️ 삭제</button><button onclick="selIds.clear();R()" style="padding:4px 10px;border-radius:6px;border:1px solid #d1d5db;background:#fff;font-size:11px;cursor:pointer">취소</button></div>';

// ── TIMELINE ──
function rTimeline(items){
  var qM={"Q1 2026":[0,2],"Q2 2026":[3,5],"Q3 2026":[6,8],"Q4 2026":[9,11],"4월":[3,3],"5월":[4,4],"6월":[5,5],"7월":[6,6],"8월":[7,7],"9월":[8,8],"10월":[9,9],"11월":[10,10],"12월":[11,11]};
  var cM=new Date().getMonth(),dM=[];
  for(var m=0;m<12;m++)dM.push({m:m,l:(m+1)+"월"});
  var gi=items.filter(function(d){return d.due&&qM[d.due]}).sort(function(a,b){var am=qM[a.due],bm=qM[b.due];return am[0]-bm[0]});
  if(!gi.length)return '<div class="empty">타임라인 항목 없음</div>';
  var sC={"완료":"#22c55e","진행중":"#f59e0b","신규":"#8b5cf6","대기":"#94a3b8","보류":"#ef4444"};
  var h='<div class="gantt-wrap"><table class="gantt-tbl"><thead><tr><th style="min-width:60px;text-align:left">ID</th><th style="min-width:100px;text-align:left">제목</th><th style="min-width:40px">상태</th>';
  dM.forEach(function(d){h+='<th style="min-width:28px;'+(d.m===cM?'background:#fef2f2;color:#dc2626;font-weight:700':'')+'">'+ d.l+'</th>'});
  h+='</tr></thead><tbody>';
  gi.forEach(function(d){
    var q=qM[d.due];
    h+='<tr style="cursor:pointer" onclick="xTog(\''+d.id+'\')">';
    h+='<td style="font-family:monospace;font-size:10px;color:var(--sub)">'+E(d.id)+'</td>';
    h+='<td style="font-size:11px;font-weight:500;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+E(d.title)+'</td>';
    h+='<td style="text-align:center"><span class="badge s-'+d.status+'" style="font-size:9px">'+E(d.status)+'</span></td>';
    dM.forEach(function(dm){
      var inR=dm.m>=q[0]&&dm.m<=q[1];
      h+='<td style="padding:2px;'+(dm.m===cM&&!inR?'background:#fef2f2':'')+'">'+(inR?'<div class="gantt-bar" style="background:'+(sC[d.status]||"#94a3b8")+'"></div>':'')+'</td>'});
    h+='</tr>';
  });
  h+='</tbody></table></div>';return h;
}

  if(mailRes.length){
    h+='<div style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:13px;font-weight:700">추출 결과 ('+mailSel.size+'/'+mailRes.length+')</span>';
    h+='<button class="mail-btn" onclick="impMail()" style="margin:0;padding:6px 14px"'+(mailSel.size?'':' disabled')+'>대시보드에 추가</button></div>';
    mailRes.forEach(function(v,i){var s=mailSel.has(i);
      h+='<div class="ext-card'+(s?" sel":"")+'" onclick="mailSel.has('+i+')?mailSel.delete('+i+'):mailSel.add('+i+');R()"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><input type="checkbox" '+(s?'checked':'')+'>';
      h+='<span class="badge" style="background:#dbeafe;color:#1e40af">'+E(v.customer)+'</span><span class="badge" style="background:#f1f5f9;color:#475569">'+E(v.l1)+'</span><span style="font-size:12px;font-weight:600">'+E(v.title)+'</span></div>';
      if(v.desc)h+='<div style="font-size:11px;color:#6b7280;margin-top:4px;margin-left:24px">'+E(v.desc)+'</div>';
      h+='</div>'});h+='</div>'}
  h+='</div>';return h;
}
function doMail(){
  var t=document.getElementById("mIn").value.trim();if(!t){toast("❌ 내용을 붙여넣어 주세요","err");return}
  mailTxt=t;mailRes=[];mailSel=new Set();
  var dc="기타";if(/e&a|E&A|이앤에이/i.test(t))dc="E&A";else if(/삼성물산|물산/i.test(t))dc="삼성물산";else if(/삼성전자|전자/i.test(t))dc="삼성전자";
  var lk=[{re:/data\s*sync|동기화/i,l:"Data Sync"},{re:/spatial|planning|positioning|pcs|clash|space/i,l:"Spatial Studio"},{re:/data\s*studio|queryset|tabular|composite/i,l:"Data Studio"},{re:/ontology|sandbox/i,l:"Ontology Sandbox"},{re:/\bBI\b|PBI|리포트/i,l:"BI"},{re:/vizio/i,l:"Vizio"},{re:/\b360\b/i,l:"360"},{re:/gaussian/i,l:"Gaussian"},{re:/\bAPI\b/i,l:"API"},{re:/서버|DB|인프라|infra/i,l:"Infra"},{re:/designer/i,l:"Designer"},{re:/관리자|admin/i,l:"Admin"},{re:/프로젝트|PJT/i,l:"PJT"},{re:/사용자|user/i,l:"User"},{re:/로그인|SSO|인증|auth/i,l:"Auth"},{re:/포털|portal/i,l:"Portal"}];
  function dT(s){if(/버그|bug|오류|에러/i.test(s))return"버그";if(/보안|security|암호화/i.test(s))return"보안";if(/인프라|서버|배포/i.test(s))return"인프라";if(/신규|new|추가|새/i.test(s))return"신규";return"개선"}
  var lines=t.split(/[\n\r]+/).map(function(l){return l.trim()}).filter(function(l){return l.length>5&&!/^(from|to|cc|subject|date|sent|받는|보내는|참조|날짜|제목)[\s:]/i.test(l)&&!/^[-=_]{3,}/.test(l)&&!/^(안녕|감사|수고|부탁|드립니다)/i.test(l)});
  var nums=lines.filter(function(l){return /^[\d]+[\.\)]\s|^[-·•]\s/.test(l)});
  var cands=nums.length>=2?nums:lines,seen=new Set();
  cands.forEach(function(ln){
    var c=ln.replace(/^[\d]+[\.\)]\s*|^[-·•]\s*/,"").trim();if(c.length<4||seen.has(c.substring(0,20)))return;seen.add(c.substring(0,20));
    var dl="Browser";for(var i=0;i<lk.length;i++){if(lk[i].re.test(c)){dl=lk[i].l;break}}
    mailRes.push({customer:dc,l1:dl,l2:"",type:dT(c),title:c.length>40?c.substring(0,40)+"...":c,desc:c.length>40?c:"",status:"신규",due:""})
  });
  if(!mailRes.length&&lines.length){var all=lines.join(" ").substring(0,200);mailRes.push({customer:dc,l1:"Browser",l2:"",type:dT(all),title:all.substring(0,40),desc:all,status:"신규",due:""})}
  mailRes.forEach(function(_,i){mailSel.add(i)});toast("✅ "+mailRes.length+"건 추출","ok");R()
}
function impMail(){
  var n=0;mailRes.forEach(function(v,i){if(!mailSel.has(i))return;data.push({id:nId(),customer:v.customer,l1:v.l1,l2:v.l2||"",type:v.type,title:v.title,desc:v.desc||"",status:"신규",due:v.due||"",assignee:"",note:"메일에서 추출",urgent:false});n++});
  mailRes=[];mailSel=new Set();mainTab="dashboard";dirty=true;toast("✅ "+n+"건 추가","ok");R()
}

// ── LOAD DATA ──
fetch("data.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){if(Array.isArray(d)&&d.length){data=d.map(function(i){i.urgent=i.urgent||false;return i});R()}}).catch(function(){R()});
</script>
