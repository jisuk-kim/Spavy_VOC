<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spavy VOC Dashboard</title>
<style>
*{margin:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;padding:16px 20px;color:#334155}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#2563eb);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
h1{font-size:20px;font-weight:700}
.sub{font-size:12px;color:#94a3b8}
.stats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:75px;padding:8px;border-radius:10px;background:#fff;border:1px solid #e2e8f0;text-align:center;cursor:pointer}
.stat:hover{border-color:#d1d5db}
.stat-n{font-size:20px;font-weight:700}
.stat-l{font-size:10px;color:#94a3b8}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab{padding:6px 14px;border-radius:6px;border:1px solid #e2e8f0;font-size:11px;cursor:pointer;background:transparent;color:#64748b;font-weight:400}
.tab.active{background:#7c3aed;color:#fff;border-color:#7c3aed;font-weight:600}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;background:#fff;border-radius:10px;border:1px solid #e2e8f0}
select,input[type=text]{padding:5px 8px;border-radius:6px;border:1px solid #d1d5db;font-size:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
th{padding:8px 6px;text-align:left;background:#f8fafc;font-weight:600;color:#64748b;font-size:11px;border-bottom:2px solid #e2e8f0}
td{padding:7px 6px;border-bottom:1px solid #f1f5f9}
tr.urg{background:#fef2f2}
.b{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;display:inline-block;white-space:nowrap}
.gantt-wrap{background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:14px}
.gantt-hdr{display:flex;border-bottom:1px solid #e2e8f0}
.gantt-label{width:220px;min-width:220px;padding:8px 12px;font-size:11px;font-weight:600;color:#64748b;border-right:1px solid #e2e8f0}
.gantt-months{flex:1;display:flex}
.gantt-mh{flex:1;text-align:center;padding:8px 0;font-size:11px;color:#94a3b8;border-right:1px solid #f1f5f9}
.gantt-mh.cur{font-weight:700;color:#7c3aed;background:#f5f3ff}
.gantt-row{display:flex;border-bottom:1px solid #f8fafc;min-height:30px;align-items:center}
.gantt-row:hover{background:#fafafa}
.gantt-item{width:220px;min-width:220px;padding:3px 12px;display:flex;align-items:center;gap:6px;border-right:1px solid #e2e8f0;overflow:hidden}
.gantt-item .cust{font-size:10px;font-weight:700;white-space:nowrap}
.gantt-item .ttl{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt-bars{flex:1;position:relative;height:30px;display:flex;align-items:center}
.gantt-bar{position:absolute;height:16px;border-radius:4px;opacity:.85}
.gantt-bar.waiting{opacity:.45}
.gantt-today{position:absolute;top:0;bottom:0;border-left:2px dashed #d1d5db;z-index:1;pointer-events:none}
.legend{display:flex;gap:12px;margin:8px 0 16px;font-size:11px;color:#94a3b8;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:12px;height:8px;border-radius:2px;display:inline-block}
.group-hdr{font-size:14px;font-weight:700;margin:14px 0 6px;padding:6px 12px;background:#f1f5f9;border-radius:8px;display:inline-block}
.group-hdr .cnt{font-weight:400;color:#94a3b8;font-size:12px}
.asgn-miss{background:#fef2f2;color:#dc2626}
.asgn-ok{background:#f0fdf4;color:#16a34a}
.urg-banner{padding:8px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;margin-bottom:10px;font-size:12px;color:#dc2626}
.empty{text-align:center;padding:24px;color:#94a3b8;font-size:13px}
.updated{font-size:11px;color:#94a3b8;margin-top:16px;text-align:right}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo">V</div>
  <div><h1>Spavy VOC Dashboard</h1><p class="sub" id="subtitle"></p></div>
</div>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<div class="flt" id="filters"></div>
<div id="content"></div>
<div class="updated" id="updated"></div>

<script>
var D = [
  {id:"VOC-0001",customer:"E&A",l1:"Browser",l2:"Properties",type:"개선",title:"Property+ hovering",desc:"보고서 연동 시 hovering 기능",status:"진행중",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0002",customer:"E&A",l1:"Browser",l2:"System Tree",type:"개선",title:"Project List 순서 변경",desc:"Project Group, Name 순서 변경",status:"완료",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0003",customer:"E&A",l1:"Browser",l2:"Viewer",type:"개선",title:"모듈창 새창/기존Tab 유지",desc:"동일 Project에서 모듈창 오픈 시 새창과 기존 Tab유지",status:"완료",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0004",customer:"E&A",l1:"Browser",l2:"Viewer",type:"버그",title:"Reset visibility 오류",desc:"R키 시 다른 폴더 파일 모두 로드",status:"진행중",due:"Q1 2026",assignee:"",note:"",urgent:true},
  {id:"VOC-0005",customer:"E&A",l1:"Browser",l2:"Properties",type:"개선",title:"권한관리 상위/하위 자동선택",desc:"상위권한 선택 시 하위 자동선택",status:"진행중",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0006",customer:"E&A",l1:"Browser",l2:"Search Anything",type:"신규",title:"Search 다중조건",desc:"Search set 외 다중조건 검색",status:"진행중",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0007",customer:"E&A",l1:"Data Studio",l2:"Tabular",type:"개선",title:"Tabular Data Manager 개선",desc:"Column setting 복사, std list, excel 업로드",status:"진행중",due:"Q1 2026",assignee:"",note:"삼인 Q1 가능",urgent:false},
  {id:"VOC-0008",customer:"E&A",l1:"BI",l2:"",type:"신규",title:"Fit World 기능",desc:"view 내에 fit world 추가",status:"진행중",due:"Q1 2026",assignee:"나경",note:"",urgent:false},
  {id:"VOC-0009",customer:"E&A",l1:"Spatial Studio",l2:"Space",type:"개선",title:"Space RVT Mass 인식",desc:"Revit Room 인식, Space 속성 연동",status:"진행중",due:"Q1 2026",assignee:"유현재",note:"",urgent:true},
  {id:"VOC-0010",customer:"E&A",l1:"Spatial Studio",l2:"Clash",type:"개선",title:"Clash File Download",desc:"Clash 파일 다운로드",status:"완료",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0011",customer:"E&A",l1:"Browser",l2:"Viewer",type:"인프라",title:"Operation Spec 측정",desc:"최소/권장 인프라 사양 측정",status:"대기",due:"Q2 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0012",customer:"E&A",l1:"Data Sync",l2:"",type:"개선",title:"SPAVY Manual URL 공유",desc:"사용자가 상시 MANUAL LINK에 접근",status:"대기",due:"Q1 2026",assignee:"",note:"",urgent:false},
  {id:"VOC-0013",customer:"삼성물산",l1:"Browser",l2:"Viewer",type:"보안",title:"DB 암호화",desc:"Database 암호화 적용",status:"대기",due:"Q2 2026",assignee:"",note:"",urgent:true},
  {id:"VOC-0014",customer:"삼성전자",l1:"Browser",l2:"Export CD",type:"신규",title:"DWG 내보내기",desc:"DWG 파일 내보내기 기능",status:"대기",due:"Q2 2026",assignee:"",note:"E&A와 공통",urgent:false},
  {id:"VOC-0015",customer:"삼성전자",l1:"Browser",l2:"Properties",type:"개선",title:"권한 제어 RBAC",desc:"Role-Based Access Control",status:"대기",due:"Q2 2026",assignee:"",note:"",urgent:true}
];

var SC={"신규":"#8b5cf6","진행중":"#f59e0b","완료":"#22c55e","대기":"#94a3b8","보류":"#ef4444"};
var TC={"신규":"#7c3aed","개선":"#2563eb","버그":"#dc2626","보안":"#d946ef","인프라":"#0891b2"};
var LC={"Data Sync":"#534AB7","Spatial Studio":"#1D9E75","Data Studio":"#378ADD","Browser":"#D85A30","Ontology Sandbox":"#D4537E","BI":"#BA7517","Vizio":"#639922","360":"#85B7EB","Gaussian":"#888780"};
var CC={"E&A":"#3b82f6","삼성물산":"#ef4444","삼성전자":"#8b5cf6","기타":"#f59e0b","공통":"#a855f7"};
var CUSTS=["E&A","삼성물산","삼성전자","기타"];
var L1S=["Data Sync","Spatial Studio","Data Studio","Browser","Ontology Sandbox","BI","Vizio","360","Gaussian"];
var TYPES=["신규","개선","버그","보안","인프라"];
var STATS2=["신규","진행중","완료","대기","보류"];
var MONTHS=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
var Q2M={"Q1 2026":[0,2],"Q2 2026":[3,5],"Q3 2026":[6,8],"Q4 2026":[9,11],"Q1 2027":[12,14]};
var curM=new Date().getMonth();
var curView="all";
var fC="",fL="",fT="",fS="",fQ="";

function badge(t,bg,c){return '<span class="b" style="background:'+bg+';color:'+c+'">'+t+'</span>';}

function init(){
  document.getElementById("subtitle").textContent=D.length+"건 · L1 9개 · Published "+new Date().toLocaleDateString("ko");
  document.getElementById("updated").textContent="Last updated: "+new Date().toLocaleString("ko");
  renderStats();renderFilters();renderTabs();render();
}

function renderStats(){
  var counts={total:D.length,urgent:0};STATS2.forEach(function(s){counts[s]=0;});
  D.forEach(function(i){if(counts[i.status]!==undefined)counts[i.status]++;if(i.urgent)counts.urgent++;});
  var items=[["전체",counts.total,"#334155"],["신규",counts["신규"],"#8b5cf6"],["진행중",counts["진행중"],"#f59e0b"],["완료",counts["완료"],"#22c55e"],["대기",counts["대기"],"#94a3b8"]];
  document.getElementById("stats").innerHTML=items.map(function(a){return '<div class="stat" onclick="filterStat(\''+a[0]+'\')"><div class="stat-n" style="color:'+a[2]+'">'+a[1]+'</div><div class="stat-l">'+a[0]+'</div></div>';}).join("");
}

function filterStat(l){if(l==="전체"){fS="";curView="all";}else if(l==="긴급"){curView="urgent";fS="";}else{fS=l;curView="all";}syncFilters();render();}

function renderFilters(){
  var h='<input type="text" id="fq" placeholder="검색" oninput="fQ=this.value;render()">';
  h+='<select id="fc" onchange="fC=this.value;render()"><option value="">고객사</option>'+CUSTS.map(function(c){return '<option>'+c+'</option>';}).join("")+'</select>';
  h+='<select id="fl" onchange="fL=this.value;render()"><option value="">L1</option>'+L1S.map(function(c){return '<option>'+c+'</option>';}).join("")+'</select>';
  h+='<select id="ft" onchange="fT=this.value;render()"><option value="">유형</option>'+TYPES.map(function(c){return '<option>'+c+'</option>';}).join("")+'</select>';
  h+='<select id="fs" onchange="fS=this.value;render()"><option value="">상태</option>'+STATS2.map(function(c){return '<option>'+c+'</option>';}).join("")+'</select>';
  document.getElementById("filters").innerHTML=h;
}

function syncFilters(){var e=document.getElementById("fs");if(e)e.value=fS;}

function renderTabs(){
  var views=[["all","전체 목록"],["timeline","타임라인"],["assignee","담당자별"],["urgent","긴급/결정필요"]];
  document.getElementById("tabs").innerHTML=views.map(function(v){return '<div class="tab'+(curView===v[0]?" active":"")+'" onclick="curView=\''+v[0]+'\';renderTabs();render()">'+v[1]+'</div>';}).join("");
}

function getFiltered(){
  return D.filter(function(i){
    if(fC&&i.customer!==fC)return false;if(fL&&i.l1!==fL)return false;if(fT&&i.type!==fT)return false;if(fS&&i.status!==fS)return false;
    if(fQ&&(i.id+" "+i.title+" "+i.desc).toLowerCase().indexOf(fQ.toLowerCase())<0)return false;return true;
  });
}

function makeTable(data, showUrgent){
  if(!data.length)return '<div class="empty">결과 없음</div>';
  var h='<table><thead><tr><th>ID</th><th>고객</th><th>L1</th><th>L2</th><th>유형</th><th>제목</th><th>상태</th><th>목표</th><th>담당</th></tr></thead><tbody>';
  data.forEach(function(i){
    h+='<tr'+(showUrgent&&i.urgent?' class="urg"':'')+'>';
    h+='<td style="font-weight:700;color:#7c3aed;font-size:11px">'+i.id+'</td>';
    h+='<td>'+badge(i.customer,"#dbeafe","#1e40af")+'</td>';
    h+='<td>'+badge(i.l1,(LC[i.l1]||"#888")+"18",LC[i.l1]||"#888")+'</td>';
    h+='<td style="font-size:11px;color:#64748b">'+(i.l2||"")+'</td>';
    h+='<td>'+badge(i.type,(TC[i.type]||"#888")+"20",TC[i.type]||"#888")+'</td>';
    h+='<td style="font-weight:500">'+(showUrgent&&i.urgent?"🔴 ":"")+i.title+'</td>';
    h+='<td>'+badge(i.status,SC[i.status]||"#888","#fff")+'</td>';
    h+='<td style="font-size:11px">'+(i.due||"")+'</td>';
    h+='<td style="font-size:11px">'+(i.assignee||"")+'</td>';
    h+='</tr>';
  });
  return h+'</tbody></table>';
}

function makeGantt(data){
  var items=data.filter(function(i){return i.status!=="완료"&&i.status!=="보류"&&i.due;}).sort(function(a,b){
    var aS=Q2M[a.due]?Q2M[a.due][0]:99,bS=Q2M[b.due]?Q2M[b.due][0]:99;
    return aS!==bS?aS-bS:a.customer.localeCompare(b.customer);
  });
  if(!items.length)return '<div class="empty">표시할 항목 없음</div>';
  var h='<div class="gantt-wrap"><div class="gantt-hdr"><div class="gantt-label">항목</div><div class="gantt-months">';
  MONTHS.forEach(function(m,idx){h+='<div class="gantt-mh'+(idx===curM?" cur":"")+'">'+m+'</div>';});
  h+='</div></div>';
  items.forEach(function(i){
    var range=Q2M[i.due];var sM=range?range[0]:0;var eM=range?Math.min(range[1],11):0;
    var left=(sM/12*100)+"%";var width=((eM-sM+1)/12*100)+"%";
    var clr=CC[i.customer]||"#94a3b8";if(i.status==="대기")clr="#94a3b8";
    var cls="gantt-bar"+(i.status==="대기"?" waiting":"");
    h+='<div class="gantt-row"><div class="gantt-item"><span class="cust" style="color:'+(CC[i.customer]||"#64748b")+'">'+i.customer+'</span><span class="ttl">'+(i.urgent?"🔴 ":"")+i.title+'</span></div>';
    h+='<div class="gantt-bars"><div class="gantt-today" style="left:'+((curM+.5)/12*100)+'%"></div>';
    h+='<div class="'+cls+'" style="left:'+left+';width:'+width+';background:'+clr+'" title="'+i.id+' · '+i.title+' · '+i.due+' · '+i.status+'"></div></div></div>';
  });
  h+='</div>';
  h+='<div class="legend">';
  Object.keys(CC).forEach(function(k){h+='<span><span class="dot" style="background:'+CC[k]+'"></span>'+k+'</span>';});
  h+='<span><span class="dot" style="background:#94a3b8;opacity:.45"></span>대기</span>';
  h+='<span><span style="width:0;height:12px;border-left:2px dashed #d1d5db;display:inline-block"></span> 현재 ('+MONTHS[curM]+')</span></div>';
  return h;
}

function render(){
  var f=getFiltered();var el=document.getElementById("content");
  if(curView==="all"){el.innerHTML=makeTable(f);}
  else if(curView==="timeline"){
    var h=makeGantt(f);
    var quarters=["Q1 2026","Q2 2026","Q3 2026","Q4 2026","Q1 2027","기타"];
    quarters.forEach(function(q){
      var qItems=q==="기타"?f.filter(function(i){return !Q2M[i.due];}):f.filter(function(i){return i.due===q;});
      if(qItems.length){h+='<div class="group-hdr">'+q+' <span class="cnt">('+qItems.length+'건)</span></div>'+makeTable(qItems);}
    });
    el.innerHTML=h;
  }
  else if(curView==="assignee"){
    var groups={};f.forEach(function(i){var k=i.assignee||"미배정";if(!groups[k])groups[k]=[];groups[k].push(i);});
    var keys=Object.keys(groups).sort(function(a,b){return a==="미배정"?1:b==="미배정"?-1:a.localeCompare(b);});
    var h2="";keys.forEach(function(k){
      var cls=k==="미배정"?"asgn-miss":"asgn-ok";
      h2+='<div class="group-hdr '+cls+'">'+k+' <span class="cnt">('+groups[k].length+'건)</span></div>'+makeTable(groups[k]);
    });
    el.innerHTML=h2||'<div class="empty">결과 없음</div>';
  }
  else if(curView==="urgent"){
    var urg=f.filter(function(i){return i.urgent||(i.status==="진행중"&&i.due==="Q1 2026");});
    var h3='<div class="urg-banner">🔴 긴급 플래그 또는 Q1 2026 진행중 항목 — 즉시 결정/조치 필요</div>';
    el.innerHTML=urg.length?h3+makeTable(urg,true):'<div class="empty">긴급 항목 없음</div>';
  }
}
init();
</script>
</body>
</html>
